<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Relatório RIZEI · HI Energy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: segundo cérebro estilo Obsidian. Identidade HI Energy (cliente) com assinatura RIZEI (laranja). Tema escuro fixo. */
/* Layout: cofre estilo Obsidian. Faixa de ícones | explorador de notas | nota aberta | grafo local e links. Identidade HI Energy, tema escuro fixo. */
:root{
  --bg:#050B1A; --panel:#0A1428; --panel2:#0C1730; --line:#1E2B47; --line2:#2A3A5C;
  --fg:#E8F1EC; --soft:#B7C3CE; --muted:#8A97AB; --accent:#A9CF4A; --accent-ink:#0B1404;
  --river:#4F8CC0; --warn:#E3A44A; --sp:#A9CF4A; --mg:#7FB2E5; --other:#C7A4F0;
  --display:'Montserrat',Arial,sans-serif; --body:'Inter',Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--panel)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:52px 270px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr);height:100%;height:100dvh;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
/* ribbon */
.ribbon{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:12px}
.logo{width:34px;height:34px;margin-bottom:10px}
.rbtn{width:36px;height:36px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.rbtn:hover,.rbtn[aria-pressed="true"]{background:var(--panel2);color:var(--accent)}
.rbtn svg{width:19px;height:19px}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.side-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.vault-name{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.vault-name small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted)}
.search{margin-top:10px;width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;color:var(--fg);font-size:13px}
.search::placeholder{color:var(--muted)}
.tree{overflow:auto;padding:8px 6px 24px;flex:1;min-height:0}
.folder>button{width:100%;display:flex;align-items:center;gap:6px;background:none;border:0;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;color:var(--soft);text-align:left}
.folder>button:hover{background:var(--panel2)}
.folder>button .chev{transition:transform .15s;width:10px;color:var(--muted)}
.folder.closed>button .chev{transform:rotate(-90deg)}
.folder.closed .files{display:none}
.files{padding-left:14px;border-left:1px solid var(--line);margin-left:13px}
.file{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 8px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file:hover{background:var(--panel2);color:var(--fg)}
.file.active{background:rgba(169,207,74,.14);color:var(--accent)}
.file mark{background:rgba(169,207,74,.35);color:var(--fg);border-radius:2px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--muted)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.tabs{display:flex;align-items:flex-end;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 8px 0;overflow-x:auto;min-height:40px;padding-top:max(6px,env(safe-area-inset-top,0px))}
.tab{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;max-width:200px}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.active{background:var(--bg);border-color:var(--line);color:var(--fg)}
.tab .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:14px;line-height:1}
.tab .x:hover{color:var(--fg)}
.mobile-bar{display:none}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.note{max-width:860px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb b{color:var(--soft);font-weight:400}
.note h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:10px 0 14px;text-wrap:balance}
.note h2{font-family:var(--display);font-weight:700;font-size:20px;margin:30px 0 10px;text-wrap:balance}
.note h3{font-family:var(--display);font-weight:700;font-size:16px;margin:22px 0 8px}
.note p,.note li{color:var(--soft)}
.note p{margin:0 0 12px;max-width:68ch}
.note ul,.note ol{margin:0 0 14px;padding-left:22px}
.note li{margin:4px 0}
.note strong{color:var(--fg)}
.wl{color:var(--accent);text-decoration:none;cursor:pointer;border-bottom:1px solid rgba(169,207,74,.35)}
.wl:hover{border-bottom-color:var(--accent);background:rgba(169,207,74,.08)}
.ext{color:#9CC6EE;text-decoration:none;border-bottom:1px dotted rgba(156,198,238,.5)}
.ext:hover{border-bottom-style:solid}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--accent);background:rgba(169,207,74,.1);border:1px solid rgba(169,207,74,.25);border-radius:999px;padding:1px 9px;margin:0 4px 4px 0;cursor:pointer}
.props{border:1px solid var(--line);border-radius:8px;margin:6px 0 20px;overflow:hidden}
.props div{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:7px 12px;border-top:1px solid var(--line);font-size:13px}
.props div:first-child{border-top:0}
.props dt{font-family:var(--mono);color:var(--muted);font-size:12px}
.props dd{margin:0;color:var(--fg);min-width:0}
.callout{border:1px solid var(--line2);border-left:3px solid var(--accent);background:var(--panel);border-radius:6px;padding:12px 14px;margin:14px 0}
.callout.warn{border-left-color:var(--warn)}
.callout.info{border-left-color:var(--mg)}
.callout .ct{font-family:var(--display);font-weight:700;font-size:13px;margin-bottom:4px;color:var(--fg)}
.callout p:last-child{margin-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.stat .n{font-family:var(--display);font-weight:800;font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--soft);margin-top:4px}
.tbl{overflow-x:auto;margin:10px 0 18px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{border-top:0;background:var(--panel);font-family:var(--mono);font-weight:600;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
thead th[data-sort]:hover{color:var(--fg)}
td.r,th.r{text-align:right}
tbody tr:hover{background:rgba(255,255,255,.025)}
.uf{font-family:var(--mono);font-size:11px;border-radius:4px;padding:1px 5px}
.uf.SP{color:var(--sp);background:rgba(169,207,74,.12)}
.uf.MG{color:var(--mg);background:rgba(127,178,229,.12)}
.bars{display:flex;flex-direction:column;gap:7px;margin:12px 0 18px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.bar .lbl{color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:16px;background:var(--panel);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .fill.mg{background:var(--mg)}
.bar .fill.mute{background:var(--line2)}
.bar .v{font-family:var(--mono);font-size:12px;text-align:right;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chip{border:1px solid var(--line2);background:var(--panel);color:var(--soft);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:rgba(169,207,74,.15);border-color:rgba(169,207,74,.5);color:var(--accent)}
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0 14px}
.mapwrap svg{display:block;width:100%;height:auto;max-height:78vh}
.mapwrap .city{cursor:pointer}
.mapwrap .city:hover circle.dot,.mapwrap .city:focus circle.dot{stroke:var(--fg);stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:4px 2px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 6px}
.card p{margin:0 0 6px;font-size:13.5px}
.src{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.big-graph{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:70vh;min-height:420px;position:relative;overflow:hidden}
.big-graph canvas{width:100%;height:100%;display:block}
/* right pane */
.right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.rsec{border-bottom:1px solid var(--line);padding:12px 14px}
.rsec h4{margin:0 0 8px;font-family:var(--mono);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);display:flex;justify-content:space-between}
.local{height:240px;background:var(--bg);border:1px solid var(--line);border-radius:8px;position:relative}
.local canvas{width:100%;height:100%;display:block}
.linklist{display:flex;flex-direction:column;gap:2px}
.linklist button{text-align:left;background:none;border:0;padding:4px 6px;border-radius:5px;font-size:13px;color:var(--soft);cursor:pointer}
.linklist button:hover{background:var(--panel2);color:var(--accent)}
.empty{font-size:12.5px;color:var(--muted)}
.outline a{display:block;font-size:12.5px;color:var(--soft);text-decoration:none;padding:3px 6px;border-radius:4px}
.outline a:hover{background:var(--panel2);color:var(--fg)}
.scrim{display:none}
.tip{position:fixed;z-index:60;pointer-events:none;max-width:300px;background:#0C1730;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:12.5px;color:var(--soft);opacity:0;transform:translateY(4px);transition:opacity .06s,transform .06s}
.tip.on{opacity:1;transform:none}
.tip .tt{font-family:var(--display);font-weight:800;font-size:14px;color:var(--fg);margin-bottom:2px}
.tip .tf{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.tip .tg{display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-variant-numeric:tabular-nums}
.tip .tg b{color:var(--fg);font-weight:600;text-align:right}
.tip .tk{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--fg)}
.tip .th{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
@media (max-width:1180px){.app{grid-template-columns:52px 250px minmax(0,1fr)}.right{display:none}.note .right-inline{display:block}}
@media (min-width:1181px){.right-inline{display:none}}
@media (max-width:760px){
  html,body{height:auto;overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);height:auto;min-height:100dvh}
  .main{overflow:visible}
  .scroll{overflow:visible}
  .ribbon{display:none}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .app.drawer .side{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
  .mobile-bar{display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(8px,env(safe-area-inset-top,0px))}
  .mobile-bar button{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:6px 10px;font-size:13px}
  .mobile-bar b{font-family:var(--display);font-size:14px}
  .tabs{display:none}
  .bar{grid-template-columns:96px minmax(0,1fr) 54px}
  .props div{grid-template-columns:110px 1fr}
}
.right-inline{border-top:1px solid var(--line);margin-top:36px;padding-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--rizei:#FF8A3D;--rizei-soft:rgba(255,138,61,.14)}
.brandbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,var(--panel) 0%,#14121A 100%);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--soft)}
.brandbar .rz{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;letter-spacing:3px;color:var(--fg)}
.brandbar .x{color:var(--muted);font-family:var(--mono)}
.brandbar .he{font-family:var(--display);font-weight:800;color:var(--accent)}
.brandbar .sp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.rzmark{width:22px;height:22px}
.vault-name .by{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--rizei);letter-spacing:1px;margin-top:2px}
.lead{font-size:16px;color:var(--fg)!important}
.stat{cursor:default}.stat .d{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0 6px;overflow-x:auto}
.chart{display:block;width:100%;min-width:420px;height:auto}
.chart .pt{cursor:pointer}.chart .pt:hover circle:last-child{stroke:#E8F1EC;stroke-width:2}
.bar[data-tip]{cursor:default}
.sig{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.sig b{font-family:var(--display);letter-spacing:3px;color:var(--fg)}
.file.active{background:var(--rizei-soft);color:var(--rizei)}

</style>
</head>
<body>
<div class="app" id="app">
  <nav class="ribbon" aria-label="Atalhos">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#0C1730"/><path d="M14 46 L28 18 L36 18 L22 46 Z" fill="#E8F1EC"/><path d="M26 46 L34 34 L44 34 L36 46 Z" fill="#E8F1EC"/><path d="M40 26 L44 18 L54 18 L50 26 Z" fill="#A9CF4A"/></svg>
    <button class="rbtn" data-go="inicio" title="Resumo" aria-label="Resumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <button class="rbtn" data-go="seguidores" title="Seguidores" aria-label="Seguidores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></button>
    <button class="rbtn" data-go="ranking" title="Ranking" aria-label="Ranking de publicações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button class="rbtn" data-go="grafo" title="Mapa do relatório" aria-label="Mapa do relatório"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7 7l10 0.5M6.5 8l4.5 8M17.5 9l-4.5 7"/></svg></button>
    <button class="rbtn" data-go="proximos-passos" title="Próximos passos" aria-label="Próximos passos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="rbtn" data-go="sobre-rizei" title="RIZEI" aria-label="Sobre a RIZEI" style="margin-top:auto"><svg class="rzmark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#FF8A3D"/><path d="M8 22 L14 15 L18 19 L24 10" fill="none" stroke="#14121A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10 H24 V15" fill="none" stroke="#14121A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </nav>
  <aside class="side" id="side" aria-label="Explorador de notas">
    <div class="side-head">
      <div class="vault-name">Relatório HI Energy <small>semana 1</small></div>
      <div class="vault-name"><span class="by">por RIZEI · 13/11/2026</span></div>
      <input class="search" id="q" type="search" placeholder="Buscar no relatório…" aria-label="Buscar no relatório">
    </div>
    <div class="tree" id="tree"></div>
    <div class="side-foot" id="count"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="tip" id="tip" role="tooltip"></div>
  <main class="main">
    <div class="brandbar"><span class="rz"><svg class="rzmark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#FF8A3D"/><path d="M8 22 L14 15 L18 19 L24 10" fill="none" stroke="#14121A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10 H24 V15" fill="none" stroke="#14121A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>RIZEI</span><span class="x">×</span><span class="he">HI ENERGY</span><span>Relatório de Instagram · 06 a 12/11/2026</span><span class="sp">@hienergy.rifaina</span></div>
    <div class="mobile-bar"><button id="menu" aria-label="Abrir notas">☰ Notas</button><b id="mtitle">Relatório</b></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="scroll" id="scroll"><article class="note" id="note"></article></div>
  </main>
  <aside class="right" aria-label="Grafo local e links">
    <div class="rsec"><h4>Grafo local <span id="lcount"></span></h4><div class="local"><canvas id="lg"></canvas></div></div>
    <div class="rsec"><h4>Links de saída</h4><div class="linklist" id="out"></div></div>
    <div class="rsec"><h4>Backlinks</h4><div class="linklist" id="back"></div></div>
    <div class="rsec"><h4>Nesta nota</h4><div class="outline" id="outline"></div></div>
  </aside>
</div>
<script>
const RZ='<svg class="rzmark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#FF8A3D"/><path d="M8 22 L14 15 L18 19 L24 10" fill="none" stroke="#14121A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10 H24 V15" fill="none" stroke="#14121A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* ============ DADOS DO RELATÓRIO ============ */
// Fonte: painel profissional do Instagram de @hienergy.rifaina, capturas de 13/11/2026 (filtros 7 e 30 dias).
const fmt=n=>n==null?'—':n.toLocaleString('pt-BR');
const L=(id,t)=>`[[${id}|${t}]]`;
const X=(u,t)=>`<a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a>`;

function lineChart(data,{w=640,h=240,color='#A9CF4A',mark=null,unit=''}={}){
  const pad={l:38,r:14,t:16,b:30};const max=Math.max(...data.map(d=>d[1]));const min=Math.min(0,...data.map(d=>d[1]));
  const X=i=>pad.l+i*(w-pad.l-pad.r)/(data.length-1),Y=v=>h-pad.b-(v-min)/(max-min||1)*(h-pad.t-pad.b);
  const pts=data.map((d,i)=>`${X(i).toFixed(1)},${Y(d[1]).toFixed(1)}`).join(' ');
  const ticks=[min,Math.round((min+max)/2),max];
  let s=`<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="Gráfico de linha">`;
  ticks.forEach(t=>{s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#1E2B47"/><text x="${pad.l-6}" y="${Y(t)+4}" text-anchor="end" fill="#8A97AB" font-size="11" font-family="JetBrains Mono,monospace">${fmt(t)}</text>`});
  if(mark!=null){const mx=X(mark);s+=`<rect x="${mx}" y="${pad.t}" width="${w-pad.r-mx}" height="${h-pad.t-pad.b}" fill="#FF8A3D" fill-opacity=".08"/><text x="${mx+6}" y="${pad.t+12}" fill="#FF8A3D" font-size="11" font-family="JetBrains Mono,monospace">RIZEI</text><line x1="${mx}" x2="${mx}" y1="${pad.t}" y2="${h-pad.b}" stroke="#FF8A3D" stroke-dasharray="4 4"/>`}
  s+=`<polygon points="${X(0)},${h-pad.b} ${pts} ${X(data.length-1)},${h-pad.b}" fill="${color}" fill-opacity=".12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{const lab=i===0||i===data.length-1||i===Math.floor(data.length/2);if(lab)s+=`<text x="${X(i)}" y="${h-10}" text-anchor="middle" fill="#8A97AB" font-size="11" font-family="JetBrains Mono,monospace">${d[0]}</text>`;
   s+=`<g class="pt" ${tipAttr(`<div class='tt'>${d[0]}</div><div class='tg'><span>Valor</span><b>${fmt(d[1])}${unit}</b></div>`)}><circle cx="${X(i)}" cy="${Y(d[1])}" r="12" fill="transparent"/><circle cx="${X(i)}" cy="${Y(d[1])}" r="${i===data.length-1?5:3.5}" fill="${color}"/></g>`});
  return s+`</svg>`;
}
const bar=(lbl,v,max,txt,cl='',tip='')=>`<div class="bar" ${tip?tipAttr(tip):''}><span class="lbl" title="${lbl}">${lbl}</span><span class="trk"><span class="fill ${cl}" style="width:${Math.max(1,100*v/max)}%;display:block"></span></span><span class="v">${txt}</span></div>`;
const kpi=(n,l,d,tip)=>`<div class="stat" ${tipAttr(tip)}><div class="n">${n}</div><div class="l">${l}</div>${d?`<div class="d">${d}</div>`:''}</div>`;

const KEYS={
 'inicio':'Alcance +146% · seguidores +24,3% · interações 3,4x por dia em 7 dias.',
 'grafo':'Mapa de todas as notas do relatório.',
 'seguidores':'50 → 92 em 30 dias (+84%). 75 → 92 nos 7 dias da RIZEI (+24,3%).',
 'alcance':'6.125 visualizações (+32%) · 3.684 pessoas (+146%) · 90% vindo de Reels.',
 'interacoes':'249 interações em 7 dias = metade do mês. Reels: 201 de 204.',
 'atividade-perfil':'81 visitas (+32% por dia). Link e endereço: 0 toques.',
 'publico':'Dados liberados a partir de 100 seguidores. Faltam 8.',
 'ranking':'Top: Reel da câmera (3 mil) e Brasília → Rifaina (1,9 mil).',
 'reels-viagem':'Viagem real = formato que a pesquisa indicou. 3 mil e 1,9 mil visualizações.',
 'carrosseis':'Interação de 8–14%, muitos reposts e envios. R$ 9.900: 0 comentários.',
 'antes-depois':'Antes: 39–211 visualizações. Depois: Reels de 1,9 mil e 3 mil.',
 'pontos-fortes':'Alcance novo, formato certo, autoridade, ritmo de seguidores e visitas.',
 'pontos-atencao':'Link/endereço em 0 · dependência de 1 Reel · stories em queda · CTA sem comentários.',
 'constancia':'Meta: 3 Reels + 1 carrossel por semana + stories todos os dias.',
 'leitura-honesta':'Base pequena, uma semana só. O que conta é a tendência.',
 'proximos-passos':'6 ações para as semanas 2 a 4. Urgente: link e endereço.',
 'impulsionamento':'R$ 10–20 por dia nos 2 melhores Reels → meta de 300 seguidores.',
 'sobre-rizei':'Pesquisa, território, plano de conteúdo e produção.',
 'metodo':'Dados → território → consumidor → conteúdo → medição.',
 'fontes':'Painel do Instagram, capturas de 13/11/2026.'
};

/* ============ MOTOR DO COFRE ============ */
const FOLDERS=['00 Painel','01 Resultados','02 Conteúdo','03 Diagnóstico','04 Próximos passos','05 RIZEI'];
const FCOLOR={'00 Painel':'#E8F1EC','01 Resultados':'#A9CF4A','02 Conteúdo':'#7FB2E5','03 Diagnóstico':'#E3A44A','04 Próximos passos':'#C7A4F0','05 RIZEI':'#FF8A3D'};
const byId=Object.fromEntries(NOTES.map(n=>[n.id,n]));
const render=s=>s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,(m,id,t)=>byId[id]?`<a class="wl" href="#${id}" data-id="${id}">${t}</a>`:t);
// links
NOTES.forEach(n=>{n.html=render(n.body());n.out=[...new Set([...n.html.matchAll(/data-id="([^"]+)"/g)].map(m=>m[1]).filter(i=>i!==n.id))];});
NOTES.forEach(n=>n.back=NOTES.filter(o=>o.out.includes(n.id)).map(o=>o.id));
const EDGES=[];NOTES.forEach(n=>n.out.forEach(t=>{if(!EDGES.some(e=>(e[0]===t&&e[1]===n.id)))EDGES.push([n.id,t])}));

const $=s=>document.querySelector(s);
let open=['inicio'],cur='inicio',filter='';
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let closed=new Set(store.get('rz-closed',[]));

function tree(){
  const q=filter.trim().toLowerCase();
  const hit=n=>!q||(n.title+' '+n.tags.join(' ')+' '+n.html.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q);
  let cnt=0;
  $('#tree').innerHTML=FOLDERS.map(f=>{
    const fs=NOTES.filter(n=>n.folder===f&&hit(n));cnt+=fs.length;
    if(q&&!fs.length)return '';
    const isClosed=!q&&closed.has(f);
    return `<div class="folder ${isClosed?'closed':''}" data-f="${f}"><button aria-expanded="${!isClosed}"><span class="chev">▾</span>${f.slice(3)} <span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)">${fs.length}</span></button><div class="files">${fs.map(n=>{let t=n.title;if(q){const i=t.toLowerCase().indexOf(q);if(i>=0)t=t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length)}return `<button class="file ${n.id===cur?'active':''}" data-id="${n.id}">${t}</button>`}).join('')}</div></div>`}).join('');
  $('#count').textContent=`${cnt} de ${NOTES.length} notas · ${EDGES.length} links`;
}
function tabs(){
  $('#tabs').innerHTML=open.map(id=>`<div class="tab ${id===cur?'active':''}" role="tab" aria-selected="${id===cur}" data-id="${id}"><span>${byId[id].title}</span>${open.length>1?`<button class="x" data-close="${id}" aria-label="Fechar aba">×</button>`:''}</div>`).join('');
}
function go(id,push=true){
  if(!byId[id])id='inicio';
  cur=id;if(!open.includes(id)){open.push(id);if(open.length>6)open.shift();}
  const n=byId[id];
  const props=Object.entries(n.props||{});
  $('#note').innerHTML=`<div class="crumb">${n.folder.slice(3)} <span>/</span> <b>${n.title}</b></div><h1>${n.title}</h1>
  <div>${n.tags.map(t=>`<span class="tag" data-tag="${t}">#${t.replace(/\s/g,'-')}</span>`).join('')}</div>
  ${props.length?`<dl class="props">${props.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`:''}
  ${n.html}
  <div class="right-inline"><h3>Links desta nota</h3><p>${n.out.map(i=>`<a class="wl" href="#${i}" data-id="${i}">${byId[i].title}</a>`).join(' · ')||'—'}</p><h3>Citada em</h3><p>${n.back.map(i=>`<a class="wl" href="#${i}" data-id="${i}">${byId[i].title}</a>`).join(' · ')||'—'}</p></div><div class="sig">${RZ}<span><b>RIZEI</b> · inteligência de mercado e conteúdo · relatório preparado para HI Energy</span></div>`;
  $('#mtitle').textContent=n.title;
  $('#scroll').scrollTop=0;
  [...$('#note').querySelectorAll('h2')].forEach((h,i)=>h.id='s'+i);
  $('#outline').innerHTML=[...$('#note').querySelectorAll('h2')].map(h=>`<a href="#${cur}" data-sec="${h.id}">${h.textContent}</a>`).join('')||'<div class="empty">Sem seções</div>';
  $('#out').innerHTML=n.out.map(i=>`<button data-id="${i}">${byId[i].title}</button>`).join('')||'<div class="empty">Nenhum</div>';
  $('#back').innerHTML=n.back.map(i=>`<button data-id="${i}">${byId[i].title}</button>`).join('')||'<div class="empty">Nenhum</div>';
  document.querySelectorAll('.rbtn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.go===id));
  tree();tabs();
  if(push&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id)}catch(e){location.hash=id}}
  if(id==='grafo')bigGraph();
  localGraph();
  $('#app').classList.remove('drawer');hideTip();
}
document.addEventListener('click',e=>{
  const sec=e.target.closest('[data-sec]');if(sec){e.preventDefault();document.getElementById(sec.dataset.sec)?.scrollIntoView({behavior:'smooth'});return}
  const cl=e.target.closest('[data-close]');if(cl){e.stopPropagation();open=open.filter(i=>i!==cl.dataset.close);if(cur===cl.dataset.close)go(open[open.length-1]);else tabs();return}
  const t=e.target.closest('[data-id]');if(t){e.preventDefault();go(t.dataset.id);return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const f=e.target.closest('.folder>button');if(f){const k=f.parentElement.dataset.f;closed.has(k)?closed.delete(k):closed.add(k);store.set('rz-closed',[...closed]);tree();return}
  const tg=e.target.closest('[data-tag]');if(tg){filter=tg.dataset.tag;$('#q').value=filter;tree();$('#app').classList.add('drawer');return}
});
$('#q').addEventListener('input',e=>{filter=e.target.value;tree()});
$('#menu').addEventListener('click',()=>$('#app').classList.add('drawer'));
$('#scrim').addEventListener('click',()=>$('#app').classList.remove('drawer'));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur)go(h,false)});

/* ---- dica ao passar o mouse ---- */
function tipHTML(id){
  const n=byId[id];if(!n)return '';
  const foot=`<div class="th">${n.out.length} links · citada em ${n.back.length} · clique para abrir</div>`;
  const pr=Object.entries(n.props||{}).slice(0,3);
  return `<div class="tt">${n.title}</div><div class="tf" style="color:${FCOLOR[n.folder]}">${n.folder.slice(3)}</div>${pr.length?`<div class="tg">${pr.map(([k,v])=>`<span>${k}</span><b style="text-align:left;font-weight:500">${v}</b>`).join('')}</div>`:''}${KEYS[id]?`<div class="tk">${KEYS[id]}</div>`:''}${foot}`;
}
const TIP=$('#tip');
function showTip(id,x,y){const h=tipHTML(id);if(!h){hideTip();return}TIP.innerHTML=h;TIP.classList.add('on');const w=TIP.offsetWidth,hh=TIP.offsetHeight;let L=x+16,T=y+16;if(L+w>innerWidth-8)L=x-w-16;if(T+hh>innerHeight-8)T=y-hh-16;TIP.style.left=Math.max(8,L)+'px';TIP.style.top=Math.max(8,T)+'px'}
function hideTip(){TIP.classList.remove('on')}
document.getElementById('scroll').addEventListener('scroll',hideTip);

document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&e.pointerType!=='touch'){TIP.innerHTML=t.dataset.tip;TIP.classList.add('on');const w=TIP.offsetWidth,hh=TIP.offsetHeight;let L=e.clientX+16,T=e.clientY+16;if(L+w>innerWidth-8)L=e.clientX-w-16;if(T+hh>innerHeight-8)T=e.clientY-hh-16;TIP.style.left=Math.max(8,L)+'px';TIP.style.top=Math.max(8,T)+'px'}else if(!(e.target.closest&&e.target.closest('canvas'))&&!(e.target.closest&&e.target.closest('[data-tip]')))hideTip()});

/* ---- grafos (força simples em canvas) ---- */
function sim(nodes,edges,w,h,iters){
  nodes.forEach((n,i)=>{if(n.x==null){const a=i*2.399;const rr=Math.sqrt(i+1)*22;n.x=w/2+Math.cos(a)*rr;n.y=h/2+Math.sin(a)*rr}n.vx=0;n.vy=0});
  const idx=Object.fromEntries(nodes.map((n,i)=>[n.id,i]));const L0=Math.min(w,h)/7;
  for(let k=0;k<iters;k++){
    const cool=1-k/iters;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y;const d=Math.sqrt(dx*dx+dy*dy)+0.5;const f=L0*L0/d/d*0.6;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
    edges.forEach(([s,t])=>{const a=nodes[idx[s]],b=nodes[idx[t]];if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+0.5,f=(d-L0)*0.03;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
    nodes.forEach(n=>{if(n.fixed){n.vx=n.vy=0;return}n.vx+=(w/2-n.x)*0.01;n.vy+=(h/2-n.y)*0.01;const v=Math.hypot(n.vx,n.vy),m=8*cool+0.5;if(v>m){n.vx*=m/v;n.vy*=m/v}n.x+=n.vx;n.y+=n.vy;n.vx*=0.5;n.vy*=0.5;n.x=Math.max(20,Math.min(w-20,n.x));n.y=Math.max(16,Math.min(h-22,n.y))});
  }
}
function paint(cv,nodes,edges,opt){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,r.width,r.height);
  const idx=Object.fromEntries(nodes.map(n=>[n.id,n]));const hv=opt.hover;
  const near=new Set();if(hv){near.add(hv);edges.forEach(([s,t])=>{if(s===hv)near.add(t);if(t===hv)near.add(s)})}
  edges.forEach(([s,t])=>{const a=idx[s],b=idx[t];if(!a||!b)return;const on=hv&&(s===hv||t===hv);ctx.strokeStyle=on?'rgba(169,207,74,.8)':'rgba(138,151,171,'+(hv?.08:.22)+')';ctx.lineWidth=on?1.6:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});
  nodes.forEach(n=>{const deg=byId[n.id].out.length+byId[n.id].back.length;const rad=n.id===cur?8:3+Math.min(6,Math.sqrt(deg)*1.2);const dim=hv&&!near.has(n.id);
    ctx.globalAlpha=dim?.25:1;ctx.fillStyle=n.id===cur?'#FF8A3D':FCOLOR[byId[n.id].folder];ctx.beginPath();ctx.arc(n.x,n.y,rad,0,7);ctx.fill();
    if((opt.labels&&(!opt.hubOnly||deg>=opt.hubOnly))||n.id===cur||near.has(n.id)){ctx.fillStyle=dim?'#5B6880':'#B7C3CE';ctx.font='11px Inter, Arial';ctx.textAlign='center';ctx.fillText(byId[n.id].title.replace(/ \((SP|MG)\)$/,'').slice(0,26),n.x,n.y+rad+12)}
    ctx.globalAlpha=1;n.rad=rad});
}
function interactive(cv,nodes,edges,opt){
  let drag=null,moved=false;const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]};
  const at=([x,y])=>nodes.find(n=>(n.x-x)**2+(n.y-y)**2<Math.max(64,(n.rad+4)**2));
  cv.onpointermove=e=>{const p=pos(e);if(drag){drag.x=p[0];drag.y=p[1];moved=true;hideTip();paint(cv,nodes,edges,opt);return}const n=at(p);const nid=n?n.id:null;if(nid!==opt.hover){opt.hover=nid;paint(cv,nodes,edges,opt)}cv.style.cursor=n?'pointer':'default';if(n&&e.pointerType!=='touch')showTip(n.id,e.clientX,e.clientY);else hideTip()};
  cv.onpointerdown=e=>{const n=at(pos(e));if(n){drag=n;moved=false;cv.setPointerCapture(e.pointerId)}};
  cv.onpointerup=e=>{if(drag&&!moved){hideTip();go(drag.id)}drag=null};
  cv.onpointerleave=()=>{opt.hover=null;hideTip();paint(cv,nodes,edges,opt)};
}
let BIG=null;
function bigGraph(){
  const cv=$('#bg');if(!cv)return;const r=cv.getBoundingClientRect();
  if(!BIG){BIG={nodes:NOTES.map(n=>({id:n.id})),opt:{labels:true,hubOnly:9}};sim(BIG.nodes,EDGES,r.width,r.height,400)}
  paint(cv,BIG.nodes,EDGES,BIG.opt);interactive(cv,BIG.nodes,EDGES,BIG.opt);
  $('#glegend').innerHTML=FOLDERS.map(f=>`<span><i style="background:${FCOLOR[f]}"></i>${f.slice(3)}</span>`).join('');
}
function localGraph(){
  const cv=$('#lg');if(!cv||!cv.offsetParent)return;const r=cv.getBoundingClientRect();
  const n=byId[cur];const ids=[cur,...new Set([...n.out,...n.back])];
  const nodes=ids.map(id=>({id}));nodes[0].x=r.width/2;nodes[0].y=r.height/2;nodes[0].fixed=true;
  const ed=EDGES.filter(([s,t])=>ids.includes(s)&&ids.includes(t));
  const k=nodes.length-1;nodes.slice(1).forEach((nd,i)=>{const a=-Math.PI/2+i*2*Math.PI/Math.max(k,1);const rr=Math.min(r.width,r.height)*0.36;nd.x=r.width/2+Math.cos(a)*rr;nd.y=r.height/2+Math.sin(a)*rr*0.9});const opt={labels:k<=8};
  paint(cv,nodes,ed,opt);interactive(cv,nodes,ed,opt);$('#lcount').textContent=ids.length-1+' links';
}
window.addEventListener('resize',()=>{localGraph();if(cur==='grafo'&&BIG)paint($('#bg'),BIG.nodes,EDGES,BIG.opt)});

go((location.hash||'#inicio').slice(1),false);
</script>
