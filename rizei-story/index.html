  --f-ui: "InterE", "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: #060c17; color: var(--white); font-family: var(--f-ui);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; overflow: hidden;
}
.stage {
  position: relative; height: calc(100% - 56px); max-height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
  overflow: hidden; border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 30px 90px rgba(0,0,0,.55);
  background: radial-gradient(ellipse 85% 55% at 50% 44%, var(--navy-lift) 0%, var(--navy) 62%, #070f1d 100%);
}
.stage:fullscreen { border-radius: 0; height: 100%; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 46% 40%, rgba(235,242,255,.85), rgba(235,242,255,.1) 22%, transparent 45%); }
.vig { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 75% 60% at 50% 45%, transparent 55%, rgba(3,8,16,.55) 100%); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 12px; }
.controls button { font: inherit; letter-spacing: .14em; text-transform: uppercase; color: var(--silver);
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.controls button:hover { border-color: var(--silver-dim); color: var(--white); }
.controls button:focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; letter-spacing: .3em;
  color: var(--silver-dim); text-transform: uppercase; }
body.export { padding: 0; gap: 0; background: var(--navy); }
body.export .stage { height: 100%; border-radius: 0; box-shadow: none; }
body.export .controls { display: none; }
</style>

  function resize() {

    cam.aspect = r.width / r.height; cam.updateProjectionMatrix();
    const tanH = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    baseDist = Math.max(590 / (tanH * cam.aspect), 1060 / tanH);
    pMat.uniforms.h.value = r.height * renderer.getPixelRatio() / (2 * tanH);
  }
  addEventListener('resize', resize); document.addEventListener('fullscreenchange', resize); resize();
  const camLocal = V3();
  function placeCamera(t) {
    const a = easeInOut(clamp(t / 6.0));
    let yaw = lerp(.62, 0, a), pitch = lerp(-.22, 0, a), dist = baseDist * lerp(1.18, 1.0, a);
    const k = easeInOut(clamp((t - T.trace0 + .6) / 1.4)) * (1 - easeInOut(clamp((t - T.trace1) / 1.4)));
    yaw += -.08 * k; dist *= 1 - .02 * k;
    const settle = easeInOut(clamp((t - T.slogan0) / 3.5)); dist *= 1 - .035 * settle;
    const target = V3(0, GROUP_Y + lerp(0, 40, k), 0);
    cam.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
    const sh = t > T.cut && t < T.cut + .35 ? (1 - (t - T.cut) / .35) * 10 : 0;
    cam.position.x += Math.sin(t * 90) * sh; cam.position.y += Math.cos(t * 77) * sh;
    cam.lookAt(target);
  }

  // ---------- frame ----------
  const flash = document.getElementById('flash');
  let zCut = false;
  function render(t) {
    placeCamera(t); cam.updateMatrixWorld(); group.updateMatrixWorld();
    camLocal.copy(cam.position); group.worldToLocal(camLocal);
    trails.begin(camLocal); glow.begin(camLocal);

    // shards
    const cutNow = t >= T.cut;
    if (cutNow !== zCut) { zCut = cutNow; const tx = getTex(cutNow ? 'Z' : 'Zfull'); shards.forEach(s => { if (s.key === 'Zfull') s.mesh.material.map = tx; }); }
    for (const s of shards) {
      const raw = (t - s.t0) / s.dur; const p = clamp(raw);
      s.mesh.visible = raw > 0;
      if (!s.mesh.visible) continue;
      s.mesh.position.copy(shardPos(s, t));
      s.mesh.quaternion.copy(s.q0).slerp(qId, easeOutCubic(p));
      s.mesh.material.opacity = 1;
      const land = s.t0 + s.dur, since = t - land;
      s.outline.material.opacity = raw < 1 ? .35 + .4 * p : Math.max(0, 1 - since / .6) * .9;
      // light beam left along the path
      const N = 20, P = [], W = [], A = [], Wg = [], Ag = [];
      for (let k = 0; k < N; k++) {
        const tk = clamp(t - k * .028, s.t0, land); P.push(shardPos(s, tk));
        const fade = Math.pow(1 - k / N, 1.6) * (since > 0 ? Math.max(0, 1 - since / .7) : 1) * clamp(raw * 4);
        W.push(5 * (1 - k / N) + 1); A.push(.95 * fade); Wg.push(26 * (1 - k / N) + 4); Ag.push(.22 * fade);
      }
      if (since < .7) { trails.strip(P, W, A); glow.strip(P, Wg, Ag); }
    }

    // links between letters: a silver pulse runs from one letter to the next as it locks in
    for (let li = 1; li < letterDone.length; li++) {
      const tt0 = letterDone[li] - .15, f = (t - tt0) / .45;
      if (f <= 0 || f > 1.6) continue;
      const a = shards.filter(s => s.li === li - 1), b = shards.filter(s => s.li === li);
      const xa = Math.max(...a.map(s => s.E.x)), xb = Math.min(...b.map(s => s.E.x));
      const y = wy(572);
      const head = lerp(xa, xb, clamp(f)), tail = lerp(xa, xb, clamp(f - .55));
      const P = [], W = [], A = []; for (let k = 0; k < 12; k++) { P.push(V3(lerp(head, tail, k / 11), y, 2)); W.push(3); A.push((1 - k / 11) * (1 - clamp(f - 1) * 1.6)); }
      trails.strip(P, W, A); glow.strip(P, W.map(w => w * 6), A.map(a => a * .25));
    }

    // sword + its trail + the slash arc
    const pose = placeSword(t);
    if (pose) {
      const N = 18, P = [], W = [], A = [], Wg = [], Ag = [];
      for (let k = 0; k < N; k++) { const pk = swordPose(Math.max(T.swordIn, t - k * .016)); P.push(pk ? pk.tip : pose.tip); W.push(4 * (1 - k / N) + 1); A.push(Math.pow(1 - k / N, 1.4)); Wg.push(30 * (1 - k / N)); Ag.push(.25 * (1 - k / N)); }
      trails.strip(P, W, A); glow.strip(P, Wg, Ag);
    }
    if (t > T.slash0 && t < T.cut + .9) {
      const f = clamp((t - T.slash0) / (T.slash1 - T.slash0)); const fade = t > T.cut ? Math.max(0, 1 - (t - T.cut) / .9) : 1;
      const P = [], W = [], A = []; const s0 = -560, s1 = lerp(-560, 640, easeIn(f));
      for (let k = 0; k < 20; k++) { const s = lerp(s1, s0, k / 19); P.push(cutC.clone().addScaledVector(uCut, s).setZ(8)); const nearZ = Math.exp(-Math.pow(s / 260, 2)); W.push(2 + 7 * nearZ); A.push(fade * (.35 + .65 * nearZ)); }
      trails.strip(P, W, A); glow.strip(P, W.map(w => w * 5), A.map(a => a * .3));
    }
    // light bar sweeping the descriptor
    const dp = drawDescr(t), dRaw = (t - T.descr0) / 1.1;
    if (dRaw > 0 && dRaw < 1.25) {
      const x = wx(D.x) + imgs.D.width * easeInOut(clamp(dp)); const yc = wy(D.y + imgs.D.height / 2); const fade = 1 - clamp((dRaw - 1) * 4);
      const P = [V3(x, yc + 46, 3), V3(x, yc, 3), V3(x, yc - 46, 3)]; trails.strip(P, [3, 3, 3], [.2 * fade, fade, .2 * fade]); glow.strip(P, [30, 30, 30], [.05 * fade, .35 * fade, .05 * fade]);
    }
    trails.end(); glow.end();
    drawKanji(t);

    // slogan
    const sp = easeOutCubic(clamp((t - T.slogan0) / 1.2)); slogan.material.opacity = sp; slogan.position.y = -390 - 40 * (1 - sp);
    const sv = easeOutCubic(clamp((t - T.slogan0 - .6) / 1.2)); service.material.opacity = sv;
    const rw = easeInOut(clamp((t - T.slogan0 - .3) / 1.0)); rule.scale.x = Math.max(.001, rw * 140); rule.material.opacity = .6 * rw;

    // particles
    let i = 0;
    for (const s of sparks) { const dt = t - s.born; if (dt < 0 || dt > s.life) { pA[i] = 0; } else { const o = s.o(); pPos[i*3] = o.x + s.v.x * dt; pPos[i*3+1] = o.y + s.v.y * dt - 420 * dt * dt; pPos[i*3+2] = o.z + s.v.z * dt; pA[i] = Math.pow(1 - dt / s.life, 1.5); } i++; }
    for (const d of dust) { pPos[i*3] = d.p.x + Math.sin(t * d.sp + d.ph) * 40; pPos[i*3+1] = d.p.y + ((t * 18 * d.sp) % 400) - 200; pPos[i*3+2] = d.p.z; pA[i] = .22 + .12 * Math.sin(t * 1.3 + d.ph); i++; }
    pPosA.needsUpdate = true; pAA.needsUpdate = true;

    flash.style.opacity = t > T.cut ? Math.max(0, .38 * (1 - (t - T.cut) / .35)) : 0;
    renderer.render(scene, cam);
  }

  // ---------- playback ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = reduce, startAt = performance.now(), pausedT = reduce ? TOTAL - .01 : 0;
  const btnPlay = document.getElementById('btn-play');
  btnPlay.textContent = paused ? 'Reproduzir' : 'Pausar';
  const curT = () => paused ? pausedT : ((performance.now() - startAt) / 1000) % TOTAL;
  btnPlay.onclick = () => { if (paused) { startAt = performance.now() - pausedT * 1000; paused = false; btnPlay.textContent = 'Pausar'; } else { pausedT = curT(); paused = true; btnPlay.textContent = 'Reproduzir'; } };
  document.getElementById('btn-replay').onclick = () => { startAt = performance.now(); paused = false; btnPlay.textContent = 'Pausar'; };
  document.getElementById('btn-fs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen().catch(() => {}); } catch (e) {} };

  window.__rizei = { render: t => render(t), total: TOTAL, timeline: T };
  if (EXPORT) { window.__ready = true; return; }
  (function loop() { render(curT()); requestAnimationFrame(loop); })();
})();
</script>
