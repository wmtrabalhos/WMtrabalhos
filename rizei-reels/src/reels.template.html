<title>RIZEI Reels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 9:16 Reels frame centred on a navy field, controls beneath. Single dark look by design. */
@font-face { font-family: "InterR"; font-weight: 300; src: url({{F_INTER300}}) format("woff2"); }
@font-face { font-family: "InterR"; font-weight: 400; src: url({{F_INTER400}}) format("woff2"); }
@font-face { font-family: "CormorantR"; font-weight: 500; src: url({{F_CG500}}) format("woff2"); }
@font-face { font-family: "CormorantR"; font-weight: 600; src: url({{F_CG600}}) format("woff2"); }
:root {
  --navy: #0b1628;
  --navy-lift: #16294a;
  --white: #ffffff;
  --silver: #c9d3e0;
  --silver-dim: #7f8ca0;
  --line: rgba(201,211,224,.18);
  --f-ui: "InterR", "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: #060c17; color: var(--white); font-family: var(--f-ui);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; overflow: hidden;
}
.stage { position: relative; height: calc(100% - 92px); max-height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
  overflow: hidden; border-radius: 18px; background: var(--navy); box-shadow: 0 0 0 1px var(--line), 0 30px 90px rgba(0,0,0,.55); }
.stage:fullscreen { border-radius: 0; height: 100%; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 44% 43%, rgba(235,242,255,.85), rgba(235,242,255,.1) 20%, transparent 42%); }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 62% at 50% 47%, transparent 55%, rgba(3,8,16,.5) 100%); }
.safe { position: absolute; inset: 0; pointer-events: none; display: none; }
.safe i { position: absolute; left: 0; right: 0; background: rgba(255,80,80,.18); }
.stage.show-safe .safe { display: block; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; letter-spacing: .3em; color: var(--silver-dim); text-transform: uppercase; }
.controls { display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(100%, 520px); font-size: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.controls button { font: inherit; letter-spacing: .12em; text-transform: uppercase; color: var(--silver); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.controls button:hover { border-color: var(--silver-dim); color: var(--white); }
.controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; }
.scrub { display: flex; align-items: center; gap: 10px; width: 100%; color: var(--silver-dim); font-variant-numeric: tabular-nums; }
.scrub input { flex: 1; min-width: 0; accent-color: #c9d3e0; }
body.export { padding: 0; gap: 0; background: var(--navy); }
body.export .stage { height: 100%; border-radius: 0; box-shadow: none; }
body.export .controls, body.export .vig { display: none; }
</style>

<div class="stage" id="stage" aria-label="Reels animado da RIZEI, Inteligência Estratégica">
  <div class="loading" id="loading">RIZEI</div>
  <canvas id="gl"></canvas>
  <div class="vig"></div>
  <div class="flash" id="flash"></div>
  <div class="safe" aria-hidden="true"><i style="top:0;height:11.5%"></i><i style="bottom:0;height:20%"></i></div>
</div>
<div class="controls">
  <div class="scrub"><span id="tcur">00,0</span><input id="scrub" type="range" min="0" max="35" step="0.05" value="0" aria-label="Posição no vídeo"><span>35,0 s</span></div>
  <div class="row">
    <button id="btn-play" type="button">Pausar</button>
    <button id="btn-replay" type="button">Reiniciar</button>
    <button id="btn-safe" type="button">Margens do Instagram</button>
    <button id="btn-fs" type="button">Tela cheia</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    total: TOTAL, scenes: TL, cut: K.cut, swordIn: K.swordIn, slash0: K.slash0, trace0: K.trace0, trace1: K.trace1, descr0: K.descr0,
    headlines: Object.fromEntries(Object.entries(H).map(([k, h]) => [k, { land: Math.max(...h.shards.map(s => s.tin + s.din)), out: h.tout }])),
    letters: letterDone, markers: markers.map(m => m.born), rows: [0, 1, 2].flatMap(c => [0, 1, 2, 3].map(r => rowT(c, r) + .3)).sort((a, b) => a - b),
    ticks: Array.from({ length: 12 }, (_, i) => tickTime(i, 0)), refresh: Array.from({ length: 6 }, (_, j) => tickTime(j * 2, 1)),
    strokes: sched.filter(s => !s.air).map(s => [s.t0, s.t1]), choice: 9.55, clusters: 5.0, tree: 7.95,
  };

  // ================= playback =================
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = reduce, startAt = performance.now(), pausedT = reduce ? TOTAL - .05 : 0;
  const btnPlay = document.getElementById('btn-play'), scrub = document.getElementById('scrub'), tcur = document.getElementById('tcur');
  const label = () => btnPlay.textContent = paused ? 'Reproduzir' : 'Pausar'; label();
  const curT = () => paused ? pausedT : ((performance.now() - startAt) / 1000) % TOTAL;
  btnPlay.onclick = () => { if (paused) { startAt = performance.now() - pausedT * 1000; paused = false; } else { pausedT = curT(); paused = true; } label(); };
  document.getElementById('btn-replay').onclick = () => { startAt = performance.now(); paused = false; label(); };
  scrub.oninput = () => { pausedT = +scrub.value; paused = true; label(); };
  document.getElementById('btn-safe').onclick = () => stage.classList.toggle('show-safe');
  document.getElementById('btn-fs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen().catch(() => {}); } catch (e) {} };
  window.__rizei = { render, total: TOTAL, events: EVENTS };
  if (EXPORT) { window.__ready = true; return; }
  (function loop() { const t = curT(); render(t); if (!paused) scrub.value = t.toFixed(2); tcur.textContent = t.toFixed(1).replace('.', ',').padStart(4, '0'); requestAnimationFrame(loop); })();
})();
</script>
